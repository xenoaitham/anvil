# Anvil arch layer: x86_64.
#
# Source: GrapheneOS/kernel_common-6.6, branch "17", head f97a55ff191d
# (2026-09-14), arch/x86/configs/gki_defconfig — the x86 GKI build GrapheneOS
# carries (emulation/Cuttlefish class; they ship no x86 device). Tags as in
# base.cfg. Mitigation pins marked "Anvil pin" restate this branch's Kconfig
# defaults, verified with tools/kernelconfig/check.py --explain, to survive
# baseline drift.

# --- address space layout randomization ---
# GOS 202da0eeca54 "use max mmap entropy by default to cover init"
# (32 bits is the x86_64 maximum for mmap randomization)
CONFIG_ARCH_MMAP_RND_BITS=32
CONFIG_ARCH_MMAP_RND_COMPAT_BITS=16
# GOS 2ceae5736aee "x86_64: raise DEFAULT_MMAP_MIN_ADDR" (first 64 MiB
# unmappable)
CONFIG_DEFAULT_MMAP_MIN_ADDR=65536
# Anvil pin (default y on branch 17): text/stack KASLR
CONFIG_RANDOMIZE_BASE=y
# Anvil pin (default y on branch 17): vmalloc/memmap region KASLR
CONFIG_RANDOMIZE_MEMORY=y

# --- page table / speculation mitigations (Anvil pins of branch defaults) ---
# Kernel/user address space separation (KPTI)
CONFIG_PAGE_TABLE_ISOLATION=y
# Indirect-branch speculation barriers (retpoline compiler thunks)
CONFIG_RETPOLINE=y
# Return thunks on x86_64 (companion of RETPOLINE against return speculation)
CONFIG_RETHUNK=y
# Retbleed UNRET mitigation on kernel entry (AMD/Hygon)
CONFIG_CPU_UNRET_ENTRY=y
# Indirect Branch Restricted Speculation on kernel entry (Intel)
CONFIG_CPU_IBRS_ENTRY=y
# Return Stack Buffer underflow (SRSO/Inception) mitigation (AMD/Hygon)
CONFIG_CPU_SRSO=y
# Intel SKL RSB underflow call-depth tracking
CONFIG_CALL_DEPTH_TRACKING=y
# Backported speculative mitigations carried on this branch:
# BHI (Branch History Injection, INTEL-SA-01036) and RFDS (Register File
# Data Sampling)
CONFIG_MITIGATION_SPECTRE_BHI=y
CONFIG_MITIGATION_RFDS=y

# --- firmware surface ---
# GOS a2aec6633cd7 added EFI_STUB=y to their x86 defconfig (RESET_ATTACK_
# MITIGATION in base.cfg depends on EFI_STUB; on arm64 it is default y)
CONFIG_EFI_STUB=y

# --- unwinder / legacy surface ---
# GKI base @ f97a55ff191d (explicit line in their x86 defconfig): frame
# pointer unwinder over ORC
CONFIG_UNWINDER_FRAME_POINTER=y
# GKI base @ f97a55ff191d: 5-level paging left off (wider VA = more to
# randomize/protect; matches their defconfig)
# CONFIG_X86_5LEVEL is not set
