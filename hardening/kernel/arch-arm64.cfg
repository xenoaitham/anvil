# Anvil arch layer: arm64.
#
# Source: GrapheneOS/kernel_common-6.6, branch "17", head f97a55ff191d
# (2026-09-14), arch/arm64/configs/gki_defconfig. Tags as in base.cfg.
# "Anvil pin" lines restate symbols GrapheneOS leaves at their Kconfig default
# on this branch; the pin value was verified against the branch's Kconfig
# definitions with tools/kernelconfig/check.py --explain, and exists to keep
# the hardening property if the baseline drifts.

# --- PAN / TTBR0 ---
# GKI base @ f97a55ff191d: software TTBR0 PAN for cores lacking hardware PAN
# (already active on ARMv8.1+ via hardware PAN)
CONFIG_ARM64_SW_TTBR0_PAN=y
# Anvil pin (default y on branch 17): privileged-access-never for kernel
# accesses to user mappings
CONFIG_ARM64_PAN=y
# Anvil pin (default y on branch 17): extended PAN for uaccess-enabled regions
CONFIG_ARM64_EPAN=y

# --- BTI / PAC / call-stack protection ---
# GKI base @ f97a55ff191d: 32-bit EL0 compat and Armv8 deprecated-instruction
# emulation. Not hardening themselves, but the BTI/PTR_AUTH/PAN/EPAN/MTE
# symbols below all `depends on COMPAT && ARMV8_DEPRECATED` — dropping them
# silently drops the whole hardware-hardening set.
CONFIG_COMPAT=y
CONFIG_ARMV8_DEPRECATED=y
# Anvil pin (default y on branch 17): Branch Target Identification for A76+
CONFIG_ARM64_BTI=y
# GOS 77d2b002c384 "enable ARM64_BTI_KERNEL" (kernel text BTI; now the branch
# default, pinned to survive baseline drift)
CONFIG_ARM64_BTI_KERNEL=y
# Anvil pin (default y on branch 17): pointer authentication codes for
# userspace
CONFIG_ARM64_PTR_AUTH=y
# Anvil pin (default y on branch 17): tagged-address syscall ABI (enable_midr
# style prctl; MTE's userspace contract rides on it)
CONFIG_ARM64_TAGGED_ADDR_ABI=y
# Anvil pin (default y on branch 17): Spectre-style branch history mitigation
CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y
# Anvil pin (default y on branch 17): PAC for the kernel itself
CONFIG_ARM64_PTR_AUTH_KERNEL=y
# GKI base @ f97a55ff191d: separate shadow call stack (return address stored
# in a dedicated DCache-resident stack)
CONFIG_SHADOW_CALL_STACK=y
# GOS d1bdd7adcd3c "disable UNWIND_PATCH_PAC_INTO_SCS": GrapheneOS refuses
# Android's hybrid PAC-into-SCS unwind mode; real SCS is kept
# CONFIG_UNWIND_PATCH_PAC_INTO_SCS is not set

# --- KASLR / address space ---
# GKI base @ f97a55ff191d (explicit line in their arm64 defconfig)
CONFIG_RANDOMIZE_BASE=y
# GKI base @ f97a55ff191d: module region randomization kept OFF exactly as
# their defconfig pins it (Android GKI module ABI region constraint)
# CONFIG_RANDOMIZE_MODULE_REGION_FULL is not set
# GOS e985b6d73030 "arm64: enable 48-bit address space"
CONFIG_ARM64_VA_BITS_48=y
# GOS efaafdbd8fa7 "arm64: raise default mmap bits for 48-bit address space"
# (33 bits is the maximum for 48-bit VA: maximum mmap entropy)
CONFIG_ARCH_MMAP_RND_BITS=33
# GOS 202da0eeca54 "use max mmap entropy by default to cover init" (compat)
CONFIG_ARCH_MMAP_RND_COMPAT_BITS=16
# GKI base @ f97a55ff191d: first 32 MiB unmappable (null-deref + SMAP-like
# protection via low-memory guard)
CONFIG_DEFAULT_MMAP_MIN_ADDR=32768

# --- MTE / KASAN hardware tags ---
# Anvil pin (default y on branch 17): Memory Tagging Extension support.
# Runtime-gated by hardware: operative only on MTE-implementing SoCs (see
# soc/*.cfg for per-family status).
CONFIG_ARM64_MTE=y
# GKI base @ f97a55ff191d (AOSP bcc6abad89b7 era, kept by GrapheneOS): MTE-
# backed KASAN in production. Without an MTE SoC the kernel self-disables
# HW-tag mode at boot; see soc/ fragments before shipping this to a family
# without MTE.
CONFIG_KASAN=y
CONFIG_KASAN_HW_TAGS=y

# --- firmware surface ---
# GKI base @ f97a55ff191d: no SMBIOS/DMI on arm64 phones
# CONFIG_DMI is not set
