# Anvil kernel hardening fragments - provenance manifest.
# One row per non-comment config line in hardening/kernel/ fragments.
# Source tree: GrapheneOS/kernel_common-6.6 branch "17", head f97a55ff191d
# (2026-09-14). "GOS <sha>" = commit authored by GrapheneOS against their
# gki_defconfig; "GKI baseline" = AOSP android15-6.6 state carried unchanged in
# their tree; "Anvil pin" = branch default restated to survive baseline drift.
# Symbols whose value differs per arch layer carry a value mapping keyed
# by arch (arch-arm64.cfg -> "arm64", arch-x86_64.cfg -> "x86_64").
# Validate: python3 tools/kernelconfig/check.py hardening/kernel/base.cfg \
#   hardening/kernel/arch-*.cfg hardening/kernel/soc/*.cfg \
#   --manifest hardening/kernel/MANIFEST.yaml --offline

