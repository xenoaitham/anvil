# Anvil SoC layer: MediaTek Dimensity 9000 / 9000+ (MT6983) and newer.
#
# Honest delta: NONE. GrapheneOS's kernel_common-6.6 carries no MediaTek-
# specific hardening lines — their gki_defconfig is family-agnostic and the
# only MediaTek references in their arm64 defconfig are GKI baseline
# (CONFIG_MTK_GZVM=m Genzone VM module, ARCH platform selects).
#
# MTE gating note (no config line): Dimensity 9000/9000+ pair Cortex-X2 with
# A710/A510 — Armv9 cores whose microarchitecture implements MTE, but
# platform-level support (firmware + DRAM tagging) is unverified for this
# family; no vendor documentation of shipped kernel-MTE support exists.
# Treat CONFIG_KASAN_HW_TAGS from arch-arm64.cfg as inert here until a
# device is proven to allocate tagged memory.
#
# If an SoC-specific trim is wanted for this family, do it in the device
# tree's own fragment, not here — nothing in the GrapheneOS source tree
# justifies inventing one.
