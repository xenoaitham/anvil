# Anvil SoC layer: Samsung Exynos 2200 (S5E9925) and newer S5E families.
#
# Honest delta: NONE. GrapheneOS's kernel_common-6.6 carries no Exynos-
# specific hardening lines; the only Samsung reference in their arm64
# gki_defconfig is GKI baseline (CONFIG_SERIAL_SAMSUNG=y console driver).
#
# MTE gating note (no config line): Exynos 2200 uses Cortex-X2/A710/A510
# (Armv9, MTE-capable microarchitecture). As with Qualcomm and MediaTek,
# platform enablement is the open question; Exynos S5E9825-class boards have
# no shipped kernel-MTE precedent. Treat CONFIG_KASAN_HW_TAGS from
# arch-arm64.cfg as inert until proven on the board.
#
# Nothing in the GrapheneOS source tree justifies inventing Exynos-specific
# config deltas; keep device work in the device's own fragment.
