# Anvil SoC layer: Google Tensor G2 (GS201) / G3 (zuma) — REFERENCE ONLY.
#
# GrapheneOS ships exactly this family with the gki_defconfig this project
# ports from (branch "17" of kernel_common-6.6). This fragment exists to
# document what their build implies per-Tensor-generation; Anvil does not
# target Tensor devices (GrapheneOS owns that ground) and a ROM builder
# should NOT merge this file.
#
# Tensor G3 (Pixel 8/8 Pro): ARM64_MTE + KASAN_HW_TAGS (arch-arm64.cfg,
# GKI base @ f97a55ff191d, AOSP bcc6abad89b7) are operative — Cortex-X3 is
# MTE-implementing and GrapheneOS relies on kernel MTE on Pixel 8. This is
# the reference deployment the MTE lines in arch-arm64.cfg are traced to.
#
# Tensor G2 (Pixel 7 series): Cortex-X1/A76/A55 — Armv8.2, NO MTE. The same
# defconfig builds for it; KASAN_HW_TAGS self-disables at boot on hardware
# without MTE support (arm64 kasan checks the CPU feature before enabling
# HW-tag mode). No config change is needed; do not "fix" it by dropping the
# lines for mixed-fleet builds.
#
# Pixel-specific pieces GrapheneOS carries OUTSIDE this kernel tree (device
# repositories: keystore/DDR warmboot handling, TPM-backed secrets, their
# Pixel-signed module set) are documented in ../README.md and deliberately
# not ported here.
