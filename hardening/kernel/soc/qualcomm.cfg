# Anvil SoC layer: Qualcomm SM8550 (Snapdragon 8 Gen 2) and newer.
#
# GrapheneOS ships one gki_defconfig for all SoC families; there are NO
# Qualcomm-specific hardening lines in their tree. This fragment carries only
# the per-SoC lines their arm64 gki_defconfig disables, plus documented MTE
# gating guidance.

# GKI base @ f97a55ff191d (arch/arm64/configs/gki_defconfig): SPMI PMIC
# arbiter driver off — PMIC register access is not used by GKI consumers and
# is direct hardware surface from userspace with the right privileges.
# CONFIG_SPMI_MSM_PMIC_ARB is not set

# GKI base @ f97a55ff191d (arch/arm64/configs/gki_defconfig): Qualcomm
# Gunyah hypervisor platform glue off in GKI; remote-virtualization attack
# surface stays with the vendor module if a device needs it.
# CONFIG_GUNYAH_QCOM_PLATFORM is not set

# MTE gating note (no config line): SM8550+ CPU complexes (Cortex-X3/A715/
# A710, X4/A720 on SM8650+) are Armv9 cores with MTE in the core design, but
# Qualcomm platform enablement (EL3/firmware, DRAM tagging) decides whether
# the kernel can actually allocate tagged memory. GrapheneOS only relies on
# kernel MTE on Pixel 8/Tensor G3 (their gki_defconfig builds KASAN_HW_TAGS).
# Verify per device: boot with kasan hw-tags on and check
# /sys/devices/system/cpu/cpu*/mte_tcf_preferred or dmesg kasan lines before
# depending on CONFIG_KASAN_HW_TAGS from arch-arm64.cfg.
