# Anvil base hardening layer (arch-independent).
#
# Source: GrapheneOS/kernel_common-6.6, branch "17", head f97a55ff191d
# (2026-09-14), files arch/{arm64,x86}/configs/gki_defconfig. Only lines whose
# effective value is identical in BOTH of their defconfigs live here.
# Provenance tags:
#   "GOS <sha>"  = commit authored by GrapheneOS (Daniel Micay / flawedworld)
#                  against their gki_defconfig
#   "GKI base"   = AOSP android15-6.6 gki_defconfig state carried unchanged in
#                  their tree (file state @ f97a55ff191d)
# Values are exactly as GrapheneOS sets them (or as their defconfig pins them);
# no Anvil-invented values.

# --- attack surface: legacy syscall/tty interfaces ---
# GOS 7e33a10a03f5 "android: disable unused cachestat syscall"
# CONFIG_CACHESTAT_SYSCALL is not set
# GOS 51d1fa9fb9ea "android: disable unused CONFIG_LEGACY_TIOCSTI"
# CONFIG_LEGACY_TIOCSTI is not set
# GOS 21096668d993 "disable LDISC_AUTOLOAD" (blocks modal auto-loading of
# line disciplines from unprivileged ioctl TIOCSETD)
# CONFIG_LDISC_AUTOLOAD is not set
# GOS cfa719a29313 "disable unused TIPC" (cluster IPC protocol, dead weight on
# phones)
# CONFIG_TIPC is not set
# GOS 4a84a30c7b20 "disable BINFMT_MISC" (arbitrary binfmt registration from
# userspace via binfmt_misc mount)
# CONFIG_BINFMT_MISC is not set
# GKI base @ f97a55ff191d: no /dev/mem, no /dev/port
# CONFIG_DEVMEM is not set
# CONFIG_DEVPORT is not set
# GKI base @ f97a55ff191d: sysfs syscall removed from the syscall table
# CONFIG_SYSFS_SYSCALL is not set

# --- network ---
# GOS 615bd95d91f0 "enable CONFIG_SYN_COOKIES"
CONFIG_SYN_COOKIES=y
# GKI base @ f97a55ff191d (both defconfigs): networking menu — required by
# SECURITY_SELINUX's dependency chain (SECURITY_NETWORK && AUDIT && NET && INET)
CONFIG_NET=y

# --- heap / page allocator hardening ---
# GKI base @ f97a55ff191d: no cross-cache slab merging
# CONFIG_SLAB_MERGE_DEFAULT is not set
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y
# GOS 2dfdb1062888 "enable CONFIG_RANDOM_KMALLOC_CACHES" (per-size randomized
# kmalloc caches to break heap grooming)
CONFIG_RANDOM_KMALLOC_CACHES=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
CONFIG_HARDENED_USERCOPY=y
# GKI base @ f97a55ff191d: legacy brk area behind the binary disabled
# CONFIG_COMPAT_BRK is not set
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
# GOS 7749342e2592 "enable CONFIG_INIT_ON_FREE_DEFAULT_ON"
CONFIG_INIT_ON_FREE_DEFAULT_ON=y
# GOS d86d224813b3 "disable memory hotplug support" (removes memory-notifier /
# add_memory attack surface unused on fixed-RAM devices)
# CONFIG_MEMORY_HOTPLUG is not set
# CONFIG_MEMORY_HOTREMOVE is not set
# GOS 07dd867518bf "disable CONFIG_HIBERNATION" (hibernate image = arbitrary
# kernel memory write primitive if mountable)
# CONFIG_HIBERNATION is not set
# GKI base @ f97a55ff191d: KFENCE low-overhead heap UAF/OOB detector
CONFIG_KFENCE=y
CONFIG_KFENCE_SAMPLE_INTERVAL=500
CONFIG_KFENCE_NUM_OBJECTS=63

# --- control-flow / build-time hardening ---
# GKI base @ f97a55ff191d (arm64 and x86): clang CFI
CONFIG_CFI_CLANG=y
# GOS 816d1996b2c8 "enable CONFIG_RANDSTRUCT_FULL" (full struct layout
# randomization). On this branch RANDSTRUCT_FULL selects MODVERSIONS, so the
# carried "# CONFIG_MODVERSIONS is not set" line below is overridden by
# Kconfig and resolves back to =y (line kept verbatim for provenance).
CONFIG_RANDSTRUCT_FULL=y
# CONFIG_MODVERSIONS is not set
# GOS 9c7603114913 "enable RANDOMIZE_KSTACK_OFFSET_DEFAULT"
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
# GKI base @ f97a55ff191d: UBSan with traps on (no recovery overhead, no logs)
CONFIG_UBSAN=y
CONFIG_UBSAN_TRAP=y
# CONFIG_UBSAN_SHIFT is not set
# CONFIG_UBSAN_BOOL is not set
# CONFIG_UBSAN_ENUM is not set

# --- module signing ---
# GOS ec69683a7042 "switch to forced module signing" (hard enforce; replaces
# Android's MODULE_SIG_PROTECT)
CONFIG_MODULE_SIG_FORCE=y
# GOS 91aa73a28405 "switch to sha256 for module signing"
CONFIG_MODULE_SIG_SHA256=y

# --- LSM stack ---
# GKI base @ f97a55ff191d: audit required by SELinux (SECURITY_SELINUX
# depends on SECURITY_NETWORK && AUDIT && NET && INET); without it the
# SELinux lines below silently vanish from a merge
CONFIG_AUDIT=y
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SAFESETID=y
# GOS b19b430760c4 "enable lockdown LSM in confidentiality mode" (forced at
# build time; blocks hibernation/locking side channels even if re-enabled)
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y

# --- usermode helper ---
# AOSP GKI 4a0622c2681a + 183a32873919, carried @ f97a55ff191d: static helper
# with an EMPTY path = call_usermodehelper() always fails; modprobe-style
# usermode helper execution is dead code
CONFIG_STATIC_USERMODEHELPER=y
CONFIG_STATIC_USERMODEHELPER_PATH=""

# --- data corruption -> fatal ---
# GKI base @ f97a55ff191d
CONFIG_BUG_ON_DATA_CORRUPTION=y
# GOS f37a3bac746b "enable DEBUG_SG" (scatterlist chain consistency checks)
CONFIG_DEBUG_SG=y
CONFIG_DEBUG_MEMORY_INIT=y
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=-1

# --- sysrq neutered but compiled in ---
# GKI base @ f97a55ff191d (MAGIC_SYSRQ=y kept for their console workflows) +
# GOS 30ba0f40cdfc "disable unnecessary sysrq functionality": no magic keys
# enabled by default, serial sysrq off
CONFIG_MAGIC_SYSRQ=y
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x0
# CONFIG_MAGIC_SYSRQ_SERIAL is not set

# --- firmware / UEFI ---
# GOS a2aec6633cd7 "enable reset attack mitigation for UEFI" (Tcg2PhysicalPresence
# reset-by-attacker mitigation)
CONFIG_RESET_ATTACK_MITIGATION=y
# GOS be937dd7da8b "enable CONFIG_EFI_DISABLE_PCI_DMA" (EFI_DURING handoff:
# busmaster DMA off until OS owns the PCI bus)
CONFIG_EFI_DISABLE_PCI_DMA=y
# GKI base @ f97a55ff191d: coredump ELF header injection off, firmware fallback
# cache off
# CONFIG_CORE_DUMP_DEFAULT_ELF_HEADERS is not set
# CONFIG_FW_CACHE is not set

# --- BPF ---
# GKI base @ f97a55ff191d, kept EXACTLY as GrapheneOS keeps it: they do NOT
# flip BPF_UNPRIV_DEFAULT_OFF (mainline default is on); unprivileged BPF is
# denied by SELinux/userspace policy instead. Carrying this line is required
# to reproduce their kernel behavior; ROMs that want the mainline default
# should override this line deliberately.
# CONFIG_BPF_UNPRIV_DEFAULT_OFF is not set
