# ramoops-n.cfg — fragment-interaction vehicle fix (NOT fragment content)
#
# LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY (base.cfg) makes the kernel reject
# hardware-configuring module params at parse time:
#   Lockdown: swapper: unsafe module parameters is restricted
#   Booting kernel: `0x138000000' invalid for parameter `ramoops.mem_address'
# crosvm passes ramoops.mem_address/mem_size on the cmdline (fs/pstore/ram.c:
# module_param_hw(mem_address, ullong, other, 0400)); with the value rejected,
# ramoops probes with the compiled-in default mem_address=0x0 and registers a
# pstore console over physical address zero:
#   ramoops: using 0x200000@0x0, ecc: 0
#   printk: console [ramoops-1] enabled
# The first userspace-triggered console flush then walks off the bogus
# ioremap of phys 0 and panics the kernel (attempt 006 baseline, t=17s):
#   BUG: unable to handle page fault ... memcpy_toio
#   persistent_ram_write -> ramoops_pstore_write -> pstore_console_write
#   Comm: logd.writer
# The clean control (no lockdown) accepts the cmdline address and boots
# through the same path. Keeping ALL Anvil hardening (forced lockdown stays),
# the vehicle-compatible resolution is to not use cmdline ramoops at all:
# CONFIG_PSTORE_RAM is not set
