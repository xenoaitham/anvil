# gpu-y.cfg — boot-vehicle deviation: virtio-gpu built in.
# The Android 17 CF userspace waits for /dev/dri/card0 in vendor early-init
# (init.cutf_cvm.rc:13); with DRM_VIRTIO_GPU=m on a 6.6 kernel nothing loads
# it (first-stage loads no modules; /vendor modules are 6.12-built and would
# also fail MODULE_SIG_FORCE). 6.12 stock control proves the pairing boots
# to sys.boot_completed when virtio_gpu is loaded in first stage
# (20260928 campaign, stock/ns-control/stock-ns-boot.log). The 6.6 control
# without it: TIMEOUT at 600s (20261008-phase0/verdict-ctrl66.txt) — GPU
# built-in is mandatory for the goal. (See also gpu-n.cfg for control runs.)
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_DRM_VIRTIO_GPU_KMS=y
