# ioring-n.cfg — closes the blind-critic round-2 gap (highest-value line).
# io_uring is the richest kernel attack surface of the last five years;
# Android blocks it for apps at the policy layer. The select-chain matters:
# BLK_DEV_UBLK (=y in origin) does `select IO_URING`, so disabling IO_URING
# alone is silently overridden — both lines must be negative.
# CONFIG_BLK_DEV_UBLK is not set
# CONFIG_IO_URING is not set
