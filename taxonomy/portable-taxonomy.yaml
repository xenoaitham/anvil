# Portable hardening taxonomy — the measuring stick for Anvil pieces.
#
# One entry per GrapheneOS hardening feature that Anvil tracks. Every
# grapheneos_ref was verified against the real repos on 2026-09-27:
#   - "GOS/kernel_common-6.6" refs are the GitHub repo at branch refs/heads/17
#   - "GOS/hardened_malloc" refs are the clone at tag 2026092500 (commit 01df350)
#   - "GOS/grapheneos.org" refs are pages in the website-source clone
#   - bare 12-hex SHAs are GitHub API-verified commits on the named repo
# portability:
#   portable   — device-independent, carries to any GKI-class arm64 device
#   partial    — carries but needs conditions (hw capability, kernel flag, vendor code)
#   pixel-only — cannot transfer without vendor/OEM cooperation (recorded for honesty)
meta:
  version: 1
  date: 2026-09-27
  sources:
    - "clone: /home/potato/grafene/ref/hardened_malloc @ tag 2026092500"
    - "clone: /home/potato/grafene/ref/platform_manifest @ 0493b9e3a3ae"
    - "clone: /home/potato/grafene/ref/kernel_manifest-6.6 @ 4f9f5acd7498"
    - "clone: /home/potato/grafene/ref/grapheneos.org (static/ pages)"
    - "api: gh api repos/GrapheneOS/kernel_common-6.6 + platform_{bionic,art,system_core}, 2026-09-27"

features:

  # ---------------------------------------------------------------- allocator
  - id: hmalloc_out_of_line_metadata
    name: Fully out-of-line allocator metadata in isolated guarded region
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: README.md section 'Security properties'; h_malloc.c"
    anvil_surface: integration/hardened_malloc
    notes: Core design, not configurable. Metadata region has high-entropy random guard regions; global state read-only after init.

  - id: hmalloc_invalid_free_detection
    name: Deterministic detection of any invalid free (double free, unaligned, unallocated)
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: README.md 'Security properties'; test/double_free_small.c, test/invalid_free_protected.c"
    anvil_surface: integration/hardened_malloc
    notes: Follows from address-range-to-metadata design; covered by 6+ test programs.

  - id: hmalloc_sized_dealloc_check
    name: C++ sized deallocation size validation (type-confusion detection)
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: new.cc; CONFIG_CXX_ALLOCATOR in config/default.mk:3"
    anvil_surface: integration/hardened_malloc
    notes: Detects mismatched sized delete even for code compiled pre-C++14.

  - id: hmalloc_zero_on_free
    name: Zero-on-free for slab allocations
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_ZERO_ON_FREE=true config/default.mk:6"
    anvil_surface: integration/hardened_malloc
    notes: Also the substrate for write-after-free detection; light preset keeps it.

  - id: hmalloc_write_after_free_check
    name: Write-after-free detection via zero-fill verification at allocation
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: config/default.mk:7 (true), config/light.mk:7 (false)"
    anvil_surface: integration/hardened_malloc
    notes: One of the exact deltas between default and light presets.

  - id: hmalloc_slot_randomize
    name: Random slot selection within slabs
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: config/default.mk:8 (true), config/light.mk:8 (false)"
    anvil_surface: integration/hardened_malloc
    notes: Second default-vs-light delta.

  - id: hmalloc_slab_canary
    name: 8-byte slab canaries absorbing small/C-string overflows
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_SLAB_CANARY=true config/default.mk:9; test/string_overflow.c"
    anvil_surface: integration/hardened_malloc
    notes: Leading zero byte contains missing-NUL overflows; checked on free.

  - id: hmalloc_slab_quarantine
    name: Delayed slab reuse via randomized array + FIFO queue, scaled per size class
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_SLAB_QUARANTINE_RANDOM_LENGTH/QUEUE_LENGTH config/default.mk:10-11"
    anvil_surface: integration/hardened_malloc
    notes: light preset sets both to 0; powers use-after-free window extension.

  - id: hmalloc_region_quarantine
    name: Large-allocation quarantine (protect+purge, FIFO ring + random swap)
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: config/default.mk:16-18 (256/1024/32MiB skip threshold)"
    anvil_surface: integration/hardened_malloc
    notes: Freed large mappings stay PROT_NONE until pushed out of quarantine.

  - id: hmalloc_free_slabs_quarantine
    name: Free-slab quarantine with randomized reuse order
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_FREE_SLABS_QUARANTINE_RANDOM_LENGTH=32 config/default.mk:19"
    anvil_surface: integration/hardened_malloc
    notes: Slabs beyond cache are purged and memory-protected.

  - id: hmalloc_guard_slabs
    name: Guard slab between every slab (interval 1)
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_GUARD_SLABS_INTERVAL=1 config/default.mk:14; light=8"
    anvil_surface: integration/hardened_malloc
    notes: Requires raised vm.max_map_count (README 'OS integration', 1048576).

  - id: hmalloc_guard_regions_large
    name: Randomly sized guard regions around large allocations
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_GUARD_SIZE_DIVISOR=2 config/default.mk:15"
    anvil_surface: integration/hardened_malloc
    notes: Random size defeats offset prediction between large objects.

  - id: hmalloc_size_class_isolation
    name: Per-size-class isolated regions with high-entropy random bases
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: README.md 'Core design' + 'Size classes' tables"
    anvil_surface: integration/hardened_malloc
    notes: No deterministic offsets between allocations of different size classes.

  - id: hmalloc_arenas
    name: Independent arenas (default 4) with per-class locks and CSPRNGs
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_N_ARENA=4 config/default.mk:21"
    anvil_surface: integration/hardened_malloc
    notes: Thread-isolated regions; no thread caches by design.

  - id: hmalloc_extended_size_classes
    name: Size classes to 128kiB + large size classes for realloc performance
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: config/default.mk:12-13; README 'Size classes' tables"
    anvil_surface: integration/hardened_malloc
    notes: Needs 48-bit VA on arm64 for default 32GiB class regions (CONFIG_CLASS_REGION_SIZE=34359738368).

  - id: hmalloc_chacha8_csprng
    name: ChaCha8 keystream randomness, per-class/arena, reseeded via getrandom()
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: chacha.c, random.c; README 'Randomness'"
    anvil_surface: integration/hardened_malloc
    notes: Seccomp whitelists must include getrandom (README 'System calls').

  - id: hmalloc_mte_slab_tagging
    name: MTE slab tagging (random tags, reserved 0 tag on free, distinct adjacent tags)
    category: allocator
    portability: partial
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: memtag.h, arm_mte.h, Android.bp:76 (-DHAS_ARM_MTE); README 'Memory tagging'"
    anvil_surface: integration/hardened_malloc
    notes: Needs ARMv8.5+ MTE hardware and kernel support; deterministic UAF/overflow detection where present. Taxonomy row for non-MTE devices must say so.

  - id: hmalloc_metadata_seal_mpk
    name: Metadata sealing via memory protection keys
    category: allocator
    portability: partial
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_SEAL_METADATA=false config/default.mk:5; README 'System calls' (pkey_alloc/pkey_mprotect)"
    anvil_surface: integration/hardened_malloc
    notes: Off by default (benefit-cost); x86_64 MPK path; baseline isolated-region protection applies regardless.

  - id: hmalloc_stats_mallinfo
    name: Allocator stats with mallinfo/malloc_info for Android GC triggering
    category: allocator
    portability: portable
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: config/default.mk:22 (CONFIG_STATS=false; true in Android builds); README 'Stats'"
    anvil_surface: integration/hardened_malloc
    notes: Android malloc_info keeps jemalloc-1 format for tooling compatibility.

  - id: hmalloc_label_memory
    name: PR_SET_VMA anonymous-memory labeling (Android)
    category: allocator
    portability: partial
    grapheneos_ref: "GOS/hardened_malloc @ 01df350: CONFIG_LABEL_MEMORY config/default.mk:24; Android.bp:73"
    anvil_surface: integration/hardened_malloc
    notes: Android-only prctl; label maps allocator regions in /proc maps.

