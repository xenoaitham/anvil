# LineageOS-official flagship: cleanest non-Pixel unlock path, but the MTE and
# relock stories remain unproven and the firmware maintenance clock still rules.
id: oneplus-12
name: OnePlus 12 (Snapdragon 8 Gen 3)

soc:
  model: Snapdragon 8 Gen 3
  mte: "unverified"
  bti_pac: "unverified"
  note: "Nominal ARMv9.2 cores (Cortex-X4/A720/A520 per public spec). No public evidence shows Qualcomm/Oppo enabling MTE in the shipping Android kernel. Core details not confirmed from a primary vendor page at review."

bootloader:
  officially_unlockable: true
  relockable: "unverified"
  rollback_protection: "unverified"
  note: "LineageOS's official waffle install guide documents a plain fastboot flashing unlock path — enable OEM unlock, reboot to bootloader, confirm the prompt — with no vendor token or waiting period mentioned. Relocking is pointed to the LineageOS FAQ and is not documented here; older OnePlus history (unlock tokens, waiting times) does not apply per the guide."

verified_boot:
  own_os_with_locked_bl: "partial"
  note: "Relocking after flashing LineageOS is contemplated by the install guide's FAQ pointer but not demonstrated; verified boot with a custom key is not available on this chain."

attestation:
  hardware: "yes"
  strongbox: "unverified"
  remote_supported_by_grapheneos_auditor: "no"
  note: "Launched with Android 14; hardware-backed key attestation mandatory. StrongBox unverified. GrapheneOS Auditor supports Pixels only."

updates:
  vendor_security_period_months: null
  note: "Launch messaging (4 OS generations, 5 years security) is public reporting; no reachable primary page at review. Verification path: OnePlus support/news pages."

kernel:
  note: "Vendor Android kernel; CONFIG_ARM64_MTE status not publicly documented."

mte_notes: "Architecturally plausible on ARMv9.2 cores, with zero public evidence of enablement — the honest cell is unverified and the user-facing answer is 'not available'. Verification path: HWCAP2_MTE on stock firmware, kernel source/defconfig inspection."

custom_os:
  gsi_feasibility: poor
  lineage_official: true
  note: "Officially supported by LineageOS (waffle) — a maintained custom OS channel, which is the best a non-Pixel can offer, still bounded by OnePlus's firmware maintenance window."

portable_hardening_score: 3.5
limitations:
  - "Cannot run GrapheneOS: fails the published criteria set (no demonstrated own-OS verified boot with relock, no MTE evidence, no StrongBox evidence, non-Pixel auditor exclusion)."
  - "MTE enablement undocumented; treat as unusable until demonstrated."
  - "Relock/rollback story unverified; verified boot with a custom OS not demonstrated."
  - "Custom OS inherits the vendor firmware maintenance window; after it closes the decay curve applies as with any non-Pixel."
evidence:
  soc: kernel-mte-doc
  bootloader: lineageos-install-waffle
  attestation: auditor-about
  soc.mte: kernel-mte-doc
  bootloader.officially_unlockable: lineageos-install-waffle
  bootloader.rollback_protection: aosp-verified-boot
  verified_boot.own_os_with_locked_bl: lineageos-install-waffle
  attestation.hardware: grapheneos-attest-guide
  attestation.remote_supported_by_grapheneos_auditor: auditor-about
  custom_os.lineage_official: lineageos-device-list
  custom_os.gsi_feasibility: grapheneos-faq-gsi
  limitations: grapheneos-faq-criteria
  verification-path-mte: verification-path-mte-enablement
  verification-path-relock: verification-path-relock-custom
  verification-path-updates: verification-path-oneplus-updates
last_reviewed: "2026-09-27"
