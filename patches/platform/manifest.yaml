# Apply-check manifest for patches/platform/.
#
# Consumed by tools/patches/apply_check.sh. The format is deliberately
# rigid so a stdlib bash parser can read it; the script rejects anything
# it does not recognize. blob_sha values pin the exact upstream file
# content a patch was generated against (git blob SHA at repo@ref):
# the script re-fetches the files, re-computes their blob SHAs, and
# refuses to run `git apply --check` on drifted content.
#
# Verification recipe for any value here:
#   gh api "repos/<repo>/contents/<path>?ref=<ref>" --jq .sha

